# Example workflow for a repository that holds an MCP server.
# Copy it to .github/workflows/mcp-writecheck.yml and replace the four marked values.
#
#   plan  runs on every pull request. It calls no tool and writes nothing, so it needs no test
#         environment. Its summary shows the plan and the plan hash, then the catalog-only
#         verdicts (MWS-ANN-4, from tools/list alone).
#   full  runs on main and on demand. It makes real writes to whatever the manifest points at.
#         It needs a test environment, and the plan hash that a person has read and accepted.
#
# REPLACE 1: the `uses:` reference. Pin the action to a full commit SHA.
# REPLACE 2: how your test backend is started (or reached).
# REPLACE 3: confirm-target, the manifest's own target.confirm.
# REPLACE 4: plan-hash, copied from the plan job's summary after reading the plan.
#
# The action fetches mcp-writecheck from the public isokron-ai/mcp-write-safety repository and
# builds it, so it needs no secret of its own. Never use pull_request_target or workflow_run
# here: every mode starts the server under test inside the job.

name: mcp-writecheck

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The plan hash covers every host named by a URL in the server's environment. Both jobs get
  # the same URL here, so that both arrive at the same hash. The plan job sends nothing to it.
  BACKEND_URL: http://127.0.0.1:4100

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The action starts the server for one tools/list request and stops it. If your server
      # cannot start without a reachable backend, commit a saved tools/list answer instead and
      # pass it as `catalog: tools.json`; the server is then not started at all.
      - name: Build the server
        run: npm ci && npm run build
      - uses: isokron-ai/mcp-writecheck-action@0000000000000000000000000000000000000000 # REPLACE 1
        with:
          manifest: writecheck.yaml
          mode: plan
          artifact-name: mcp-writecheck-plan
      - uses: isokron-ai/mcp-writecheck-action@0000000000000000000000000000000000000000 # REPLACE 1
        with:
          manifest: writecheck.yaml
          mode: catalog
          fail-on: any
          artifact-name: mcp-writecheck-catalog

  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # One run at a time against one test environment: two runs would be each other's second writer.
    concurrency:
      group: mcp-writecheck-test-environment
      cancel-in-progress: false
    env:
      # A credential that is valid only in the test environment. The manifest lists the variable
      # under server.env_passthrough, so its value is redacted from the results.
      API_TOKEN: ${{ secrets.TEST_BACKEND_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the server
        run: npm ci && npm run build
      - name: Start the test backend # REPLACE 2
        run: |
          docker run --detach --name test-backend --publish 127.0.0.1:4100:4100 \
            --env API_TOKEN ghcr.io/your-org/your-backend:test
      - uses: isokron-ai/mcp-writecheck-action@0000000000000000000000000000000000000000 # REPLACE 1
        with:
          manifest: writecheck.yaml
          mode: full
          fail-on: must
          confirm-target: staging-tracker.internal # REPLACE 3
          plan-hash: 0123456789abcdef # REPLACE 4
