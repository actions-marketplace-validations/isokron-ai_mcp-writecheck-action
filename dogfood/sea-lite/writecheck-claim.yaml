# mcp-writecheck manifest for sea-lite, cut down to one check: MWS-ANN-2 and ANN-5 for sea_claim,
# called on a scratch ticket, with no idempotency key named. It exists for the workflow's
# cli-fixed-bugs job, which keeps two former CLI false results from coming back: CLI 0295ed6 read the
# claim the call places on an unclaimed ticket (claim: null -> an object) as data removed or replaced
# (C3, sea_claim `violated`), and reported MWS-RETRY-1 `violated` on sea_create, whose input schema
# offers idempotency_key, because this manifest names no key (C4). Both are fixed in f573a24; the job
# fails if either returns, or if anything else is violated. Same server, store and guard as
# writecheck.yaml.

mws: "0.9"
prefix: mwsdf

server:
  stdio: [bash, serve.sh]
  cwd: .
  env_public: [SEA_LITE_DATA_DIR]
  protocol: auto

target:
  environment: test
  confirm: sea-lite-dogfood
  guard: { tool: sea_list, args: { query: dogfoodguard, include_terminal: true }, path: "tickets[0].title", pattern: "^dogfoodguard$" }

limits: { write_budget: 200, writes_per_second: 100, timeout_ms: 20000 }

secrets:
  issuing_tools: [sea_claim, sea_next, sea_create]

calls:
  sea_claim: { resource: ticket, args: { ticket_ids: ["{{id}}"], lease_seconds: 60 } }

resources:
  - name: ticket
    create:
      tool: sea_create
      args: { title: "{{marker}}", body: seeded body, kind: chore, priority: high, tags: [dogfood, seeded] }
      id: ticket.id
      name_path: ticket.title
    read:
      tool: sea_get
      args: { id: "{{id}}" }
      object: ticket
      ignore: [updated_at, last_seq]
    list:
      tool: sea_list
      args: { include_terminal: true, limit: 200 }
      items: tickets
      id: id
      name: title
      ignore: [updated_at]
      next: { path: next_cursor, arg: cursor }
    missing_id: 00000000-0000-4000-8000-000000000000
    cleanup: ephemeral
