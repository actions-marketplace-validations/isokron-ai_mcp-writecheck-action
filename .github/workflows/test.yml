# Unit tests that need no secret. The contract tests that need a built CLI (CLI_DIR) or the
# spec (MWS_SPEC) skip themselves here; selftest.yml runs them with both.

name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Unit tests
        run: |
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/unit.tap" test/*.test.mjs
      - name: Job summary
        if: always()
        run: |
          TAP="$RUNNER_TEMP/unit.tap"
          [ -f "$TAP" ] || { echo "No test output." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          count() { sed -n "s/^# $1 //p" "$TAP" | tail -1; }
          {
            echo "## Unit tests"
            echo
            echo "tests $(count tests), pass $(count pass), fail $(count fail), skipped $(count skipped)"
            if grep -q '# SKIP' "$TAP"; then
              echo
              echo "Skipped here because they need a built CLI (\`CLI_DIR\`) or the spec (\`MWS_SPEC\`), which this workflow does not have; \`selftest.yml\` runs them:"
              echo
              grep '# SKIP' "$TAP" | sed -E 's/^ *ok [0-9]+ - (.*) # SKIP (.*)$/- \1 (\2)/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # WC12: the PostgreSQL fixture of the writecheck loop against a real PostgreSQL on the runner (not the sandbox: that is
  # loop-fixture.yml's job): the pinned CLI over the correct build and over each defect build, test/pg-fixture.test.mjs.
  # The CLI is built first, from its own lockfile with install scripts off; only then are the fixture's dependencies
  # installed (the platform package's install script links the PostgreSQL binaries' libraries). No secret, no service
  # container: the database is a process of this job on 127.0.0.1.
  pg-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Choose the CLI commit
        run: dogfood/cli-ref.sh
      - name: Fetch and build the CLI
        run: |
          git init -q mws-cli
          git -C mws-cli remote add origin https://github.com/isokron-ai/mcp-write-safety.git
          git -C mws-cli sparse-checkout set --no-cone /packages/writecheck/
          git -C mws-cli -c protocol.version=2 fetch -q --depth 1 --filter=blob:none origin "$CLI_REF"
          git -C mws-cli -c advice.detachedHead=false checkout -q FETCH_HEAD
          dogfood/build-cli.sh
      - name: Install the fixture's dependencies
        working-directory: loop/fixtures/pg-tracker
        run: npm ci --omit=dev --no-audit --no-fund --loglevel=error
      - name: PostgreSQL fixture tests (known good, known bad)
        env:
          CLI_DIR: mws-cli/packages/writecheck
        run: node --test --test-reporter=spec test/pg-fixture.test.mjs
