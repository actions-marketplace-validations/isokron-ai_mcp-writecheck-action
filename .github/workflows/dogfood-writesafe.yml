# Dogfood: this action against writesafe (strapi-plugin-writesafe-mcp), IsoKron's Strapi 5 plugin.
#
# The job checks out the public plugin repository at a pinned commit, builds its test app with the
# plugin installed from the packed tarball (the plugin repository's own ci/prepare_app.sh), starts
# Strapi 5.62.0 on SQLite inside the runner, seeds test data and runs the action.
#
#   plan  on: the plan and its hash (tools/list only; nothing is written).
#   full  on: the plan, the catalog and the full run (mode full, fail-on must) against the same throwaway
#         Strapi; the plan hash must match the one pinned below.
#
# Security: no pull_request_target; dispatch only (see `on:`). The one secret, MWS_CLI_TOKEN (read-only
# on the CLI's repository), is used by one checkout step that runs before anything of Strapi is installed
# or started; the action gets the built CLI through cli-path, never the token. Every Strapi credential is generated in the job and masked.
# Third-party actions are pinned by full SHA. Strapi listens on 127.0.0.1 only.

name: "dogfood: writesafe"

on:
  # Dispatch only, for now: the test app installs Strapi's whole npm tree (unlocked, fixed by date), and
  # while the CLI's repository is private this job needs MWS_CLI_TOKEN. When the CLI is on npm or its
  # repository is public, drop the secret and add back: schedule (cron '29 3 * * *'), and pull_request
  # and push to main on the paths of this workflow, with the same-repository `if:` on the jobs.
  workflow_dispatch:
    inputs:
      cli-ref:
        description: mcp-writecheck commit to test with (full 40-character SHA). Empty for the action's default.
        required: false
        default: ''
      plan-hashes:
        description: "Accepted plan hashes for that CLI, after reading the plans: space-separated job=hash pairs (jobs: plan, full)."
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: dogfood-writesafe-${{ github.ref }}
  cancel-in-progress: false

env:
  # isokron-ai/strapi-plugin-writesafe main 7120917 (16 Nov: the public sync of source db70c56, which adds #45, #46 and
  # #48, the schema cache and descriptions, to the self-test fixes and X4).
  WS_REF: 71209177a83a0114d5cfa55c89221b9ca1ebec63
  STRAPI_VERSION: 5.62.0
  STRAPI_TELEMETRY_DISABLED: 'true'
  DO_NOT_TRACK: '1'
  PLAN_HASHES: ${{ inputs.plan-hashes }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAN_HASH: 7dc4aaa553b45018
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The CLI first, before any third-party code runs in this job: the only step with the token.
      - id: cliref
        name: Choose the CLI commit
        env:
          INPUT_REF: ${{ inputs.cli-ref }}
        run: dogfood/cli-ref.sh
      - name: Check out mcp-writecheck
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ steps.cliref.outputs.ref }}
          token: ${{ secrets.MWS_CLI_TOKEN }}
          path: mws-cli
          sparse-checkout: packages/writecheck
          persist-credentials: false
      - name: Build mcp-writecheck
        run: dogfood/build-cli.sh
      - name: Check out writesafe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/strapi-plugin-writesafe
          ref: ${{ env.WS_REF }}
          path: ws
          persist-credentials: false
      - name: Build the test app
        run: dogfood/writesafe/strapi.sh prepare
      - name: Start Strapi and seed test data
        run: dogfood/writesafe/strapi.sh start
      - id: plan
        name: Plan
        uses: ./
        with:
          manifest: dogfood/writesafe/writecheck.yaml
          mode: plan
          artifact-name: writesafe-plan
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh "$PLAN_HASH" "$SEEN" plan
      - name: Stop Strapi
        if: always()
        run: dogfood/writesafe/strapi.sh stop

  # Full mode against the plugin at WS_REF, whose self-test fixes are merged and synced. Everything it
  # writes goes to the job's own throwaway Strapi (SQLite in the runner, test data only). PLAN_HASH is the
  # full job's plan, read before it was pinned.
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAN_HASH: 7dc4aaa553b45018
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The CLI first, before any third-party code runs in this job: the only step with the token.
      - id: cliref
        name: Choose the CLI commit
        env:
          INPUT_REF: ${{ inputs.cli-ref }}
        run: dogfood/cli-ref.sh
      - name: Check out mcp-writecheck
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/mcp-write-safety
          ref: ${{ steps.cliref.outputs.ref }}
          token: ${{ secrets.MWS_CLI_TOKEN }}
          path: mws-cli
          sparse-checkout: packages/writecheck
          persist-credentials: false
      - name: Build mcp-writecheck
        run: dogfood/build-cli.sh
      - name: Check out writesafe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: isokron-ai/strapi-plugin-writesafe
          ref: ${{ env.WS_REF }}
          path: ws
          persist-credentials: false
      - name: Build the test app
        run: dogfood/writesafe/strapi.sh prepare
      - name: Start Strapi and seed test data
        run: dogfood/writesafe/strapi.sh start
      - id: plan
        name: Plan
        uses: ./
        with:
          manifest: dogfood/writesafe/writecheck.yaml
          mode: plan
          artifact-name: writesafe-full-plan
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Compare the plan hash with the accepted one
        env:
          SEEN: ${{ steps.plan.outputs.plan-hash }}
        run: dogfood/check-plan-hash.sh "$PLAN_HASH" "$SEEN" full
      - name: Catalog
        uses: ./
        with:
          manifest: dogfood/writesafe/writecheck.yaml
          mode: catalog
          fail-on: must
          artifact-name: writesafe-catalog
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Full run
        uses: ./
        with:
          manifest: dogfood/writesafe/writecheck.yaml
          mode: full
          fail-on: must
          confirm-target: writesafe-dogfood-strapi-5.62.0
          plan-hash: ${{ env.ACCEPTED_PLAN_HASH }}
          artifact-name: writesafe-full
          cli-path: ${{ env.MWSC_CLI_PATH }}
      - name: Stop Strapi
        if: always()
        run: dogfood/writesafe/strapi.sh stop
