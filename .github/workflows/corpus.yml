# Loop worker: the writecheck lane of isokron-ai/tool-qa. The pump dispatches this workflow (tool-qa
# pump/workflows.json, "writecheck": file corpus.yml, ref main, shard_size 10) with shard_id, attempt_id and items
# (tool-qa docs/INTERFACES.md, "Worker dispatch"); each item names a subject (a public GitHub repository, owner/name)
# with the run_key and fence its result must quote. loop/run-items.mjs maps each subject to its npm or PyPI package
# (tool-qa's seed, or IsoKron's own fixture servers in loop/fixtures.json), installs and runs it in the hardened
# sandbox of isokron-ai/mcp-surface-corpus (gVisor, deny-by-default egress, a DNS logger, a read-only root, uid 65534,
# every capability dropped, no runner environment), and runs mcp-writecheck there, the CLI and the server in two
# separate sandbox containers joined only by the protocol: init, plan and catalog for every
# subject (tools/list only, no tool is called), and the full write test only for a fixture server whose plan hash a
# person accepted, against a disposable backend inside the same sandbox. Nothing reaches a real external system.
# tool-qa's worker-kit then seals one bundle per item to tool-qa's ingest key and uploads it as
# result-<attempt_id>-<i>.tar.age. loop/README.md says what a bundle holds.
#
# This file replaced the hand-dispatched corpus batch workflow, which is now corpus-batch.yml, unchanged (its own
# sandbox, corpus/run-shard.mjs, is still used there and is to be retired once this lane has run its targets:
# loop/README.md, "The older corpus path"). The dogfood workflows are not touched.
#
# Order: mcp-surface-corpus's reusable sandbox-conformance.yml must pass first; then, in the job, the inputs are
# checked whole; the CLI is built from its own lockfile before anything else; the sandbox guard action (gVisor, the
# firewall, the hostile self test on this runner) must pass; the shard's controls (forgery,
# known answer) must pass, or nothing is written or uploaded; the items run; then every container is removed and
# Docker stopped, and only then do the worker-kit steps seal and upload. No untrusted code runs in a step that
# could reach the upload token: targets run only inside the sandbox, and are gone before the first upload step.
#
# Security: workflow_dispatch only, from main; permissions: {} at the top and contents: read for the jobs that
# check out this repository; no secrets. The inputs reach steps through env: only. The kill switch (loop/guard.mjs:
# LOOP_ENABLED, LOOP_PAUSE_UNTIL, LANE_WRITECHECK_ENABLED) stops the lane without failing a run. Actions are pinned
# by full SHA; the other repositories are fetched by full commit SHA (loop/prepare.sh).

name: writecheck

on:
  workflow_dispatch:
    inputs:
      shard_id:
        description: Shard id from the tool-qa pump.
        required: true
        type: string
      attempt_id:
        description: Attempt id from the tool-qa pump; every result quotes it.
        required: true
        type: string
      items:
        description: 'JSON list of 1 to 10 {"subject": "owner/name", "run_key": "<64 hex>", "fence": <n>}.'
        required: true
        type: string

run-name: shard ${{ inputs.shard_id }}

permissions: {}

concurrency:
  group: writecheck-${{ inputs.shard_id }}
  cancel-in-progress: false

env:
  # isokron-ai/tool-qa: the worker-kit that seals and uploads (every worker-kit step below names this commit;
  # test/loop-workflow.test.mjs checks), and the seed the subjects are mapped with.
  WORKER_KIT_REF: 'b1f25a9b0b7655f45eb353f31562a93d9319d5a4'
  SEED_REF: 'b1f25a9b0b7655f45eb353f31562a93d9319d5a4'
  # isokron-ai/mcp-surface-corpus main at 94b0a4a (pull request 11: capped work volumes, data-root and container logs,
  # the link-safe readout, and the guard's link, socket, flood and archive-bomb cases; 9 and 10: the install-network cases
  # and the proxy positive control, which this lane's npm installs with scripts need; 8: native npm modules built from
  # source in the node*-build images; 7: the sandbox guard action, the reusable conformance workflow). The conformance job and the sandbox-guard step name this same commit.
  SANDBOX_REF: '94b0a4a1e5c0d273d412a2962754ba7044b37923'

jobs:
  guard:
    if: github.repository == 'isokron-ai/mcp-writecheck-action' && github.ref == 'refs/heads/main'
    name: writecheck-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      # First, before anything is checked out: LOOP_ENABLED must be exactly "true". Off is a notice, not a failure.
      - id: enabled
        name: Kill switch (LOOP_ENABLED)
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
        run: |
          if [[ "$LOOP_ENABLED" == "true" ]]; then echo "on=true" >> "$GITHUB_OUTPUT"
          else echo "::notice title=writecheck::LOOP_ENABLED is not \"true\"; the loop is off and nothing runs"; fi
      - if: steps.enabled.outputs.on == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: loop/guard.mjs
          sparse-checkout-cone-mode: false
      - id: guard
        if: steps.enabled.outputs.on == 'true'
        name: Kill switch (pause, lane switch, pins)
        env:
          LOOP_ENABLED: ${{ vars.LOOP_ENABLED }}
          LOOP_PAUSE_UNTIL: ${{ vars.LOOP_PAUSE_UNTIL }}
          LANE_WRITECHECK_ENABLED: ${{ vars.LANE_WRITECHECK_ENABLED }}
        run: node loop/guard.mjs --lane writecheck

  # mcp-surface-corpus's reusable conformance workflow at the pinned commit: the sandbox proven on today's runner
  # image before any shard job starts. The job below still runs the sandbox guard on its own runner.
  conformance:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    permissions:
      contents: read
    uses: isokron-ai/mcp-surface-corpus/.github/workflows/sandbox-conformance.yml@94b0a4a1e5c0d273d412a2962754ba7044b37923 # SANDBOX_REF
    with:
      mutations: false
      artifact-prefix: writecheck-conformance

  writecheck:
    needs: [guard, conformance]
    if: needs.guard.outputs.proceed == 'true' && needs.conformance.outputs.verdict == 'pass'
    name: writecheck
    runs-on: ubuntu-24.04
    # Below the pump's lease for a shard of 10: 1.5 x (4 + 10 x 2) + 10 = 46 minutes. The driver starts no item
    # after 26 minutes of items; those not started report a retryable skip.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check the inputs
        env:
          SHARD_ID: ${{ inputs.shard_id }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          ITEMS: ${{ inputs.items }}
        run: |
          # Whole-string checks: a newline or control character anywhere fails the match. loop/items.mjs checks the
          # items in full (JSON, 1 to 10 entries, subject, run_key, fence) right after the checkout.
          id_re='^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
          items_re='^\[[^[:cntrl:]]+\]$'
          if [[ ! "$SHARD_ID" =~ $id_re ]]; then echo "::error title=writecheck::shard_id is malformed"; exit 1; fi
          if [[ ! "$ATTEMPT_ID" =~ $id_re ]]; then echo "::error title=writecheck::attempt_id is malformed"; exit 1; fi
          if [[ ! "$ITEMS" =~ $items_re ]] || [ "${#ITEMS}" -gt 60000 ]; then echo "::error title=writecheck::items must be one line of JSON, a list of at most 60000 characters"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check the items in full
        env:
          ITEMS: ${{ inputs.items }}
        run: node --input-type=module -e 'import { parseItems } from "./loop/items.mjs"; console.log(parseItems(process.env.ITEMS).length + " item(s)")'
      - name: Choose the CLI commit
        run: dogfood/cli-ref.sh
      # The CLI first, before any third-party code runs in this job; then the sandbox's own code and the seed.
      - name: Fetch and build
        run: loop/prepare.sh fetch
      # gVisor, the firewall and the hostile self test on this very runner, before any target; the step fails
      # unless the telemetry check recomputes a pass.
      - id: sandbox
        name: Sandbox guard (gVisor, firewall, self test)
        uses: isokron-ai/mcp-surface-corpus/sandbox-guard@94b0a4a1e5c0d273d412a2962754ba7044b37923 # SANDBOX_REF
      - name: The guard ran the pinned sandbox and passed
        env:
          VERDICT: ${{ steps.sandbox.outputs.verdict }}
          GUARD_SHA: ${{ steps.sandbox.outputs.sandbox-sha }}
        run: |
          [ "$VERDICT" = pass ] || { echo "::error::the sandbox self test did not pass"; exit 1; }
          [ "$GUARD_SHA" = "$SANDBOX_REF" ] || { echo "::error::the sandbox guard ran another commit than SANDBOX_REF"; exit 1; }
          [ "$(git -C msc rev-parse HEAD)" = "$SANDBOX_REF" ] || { echo "::error::the driver's sandbox checkout is not SANDBOX_REF"; exit 1; }
      - id: run
        name: Run the items in the sandbox
        env:
          SHARD_ID: ${{ inputs.shard_id }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          ITEMS: ${{ inputs.items }}
        run: node loop/run-items.mjs --msc msc --cli "$MWSC_CLI_PATH" --seed toolqa/history/seed-v1.json --out "$RUNNER_TEMP/wc" --lane ci
      - id: teardown
        name: End the sandbox before anything is sealed
        if: ${{ !cancelled() }}
        run: loop/teardown.sh
      # One step per item (at most 10, the shard size; has_<i> is set for every item that has a bundle). Only after
      # the controls passed and the sandbox is gone. One item's failed upload does not stop the others.
      - name: Seal and upload item 0
        if: ${{ !cancelled() && steps.teardown.outcome == 'success' && steps.run.outputs.controls_ok == 'true' && steps.run.outputs.has_0 == 'true' }}
        uses: isokron-ai/tool-qa/worker-kit@b1f25a9b0b7655f45eb353f31562a93d9319d5a4 # WORKER_KIT_REF
        with:
          bundle-dir: ${{ runner.temp }}/wc/0/bundle
          meta-file: ${{ runner.temp }}/wc/0/meta.json
          attempt-id: ${{ inputs.attempt_id }}
          item-index: '0'
          fence: ${{ steps.run.outputs.fence_0 }}
          run-key: ${{ steps.run.outputs.run_key_0 }}
      - name: Seal and upload item 1
        if: ${{ !cancelled() && steps.teardown.outcome == 'success' && steps.run.outputs.controls_ok == 'true' && steps.run.outputs.has_1 == 'true' }}
        uses: isokron-ai/tool-qa/worker-kit@b1f25a9b0b7655f45eb353f31562a93d9319d5a4 # WORKER_KIT_REF
        with:
          bundle-dir: ${{ runner.temp }}/wc/1/bundle
          meta-file: ${{ runner.temp }}/wc/1/meta.json
          attempt-id: ${{ inputs.attempt_id }}
          item-index: '1'
          fence: ${{ steps.run.outputs.fence_1 }}
          run-key: ${{ steps.run.outputs.run_key_1 }}
      - name: Seal and upload item 2
        if: ${{ !cancelled() && steps.teardown.outcome == 'success' && steps.run.outputs.controls_ok == 'true' && steps.run.outputs.has_2 == 'true' }}
        uses: isokron-ai/tool-qa/worker-kit@b1f25a9b0b7655f45eb353f31562a93d9319d5a4 # WORKER_KIT_REF
        with:
          bundle-dir: ${{ runner.temp }}/wc/2/bundle
          meta-file: ${{ runner.temp }}/wc/2/meta.json
          attempt-id: ${{ inputs.attempt_id }}
          item-index: '2'
          fence: ${{ steps.run.outputs.fence_2 }}
          run-key: ${{ steps.run.outputs.run_key_2 }}
      - name: Seal and upload item 3
        if: ${{ !cancelled() && steps.teardown.outcome == 'success' && steps.run.outputs.controls_ok == 'true' && steps.run.outputs.has_3 == 'true' }}
        uses: isokron-ai/tool-qa/worker-kit@b1f25a9b0b7655f45eb353f31562a93d9319d5a4 # WORKER_KIT_REF
        with:
          bundle-dir: ${{ runner.temp }}/wc/3/bundle
          meta-file: ${{ runner.temp }}/wc/3/meta.json
          attempt-id: ${{ inputs.attempt_id }}
          item-index: '3'
          fence: ${{ steps.run.outputs.fence_3 }}
          run-key: ${{ steps.run.outputs.run_key_3 }}
      - name: Seal and upload item 4
        if: ${{ !cancelled() && steps.teardown.outcome == 'success' && steps.run.outputs.controls_ok == 'true' && steps.run.outputs.has_4 == 'true' }}
        uses: isokron-ai/tool-qa/worker-kit@b1f25a9b0b7655f45eb353f31562a93d9319d5a4 # WORKER_KIT_REF
        with:
          bundle-dir: ${{ runner.temp }}/wc/4/bundle
          meta-file: ${{ runner.temp }}/wc/4/meta.json
          attempt-id: ${{ inputs.attempt_id }}
          item-index: '4'
          fence: ${{ steps.run.outputs.fence_4 }}
          run-key: ${{ steps.run.outputs.run_key_4 }}
      - name: Seal and upload item 5
        if: ${{ !cancelled() && steps.teardown.outcome == 'success' && steps.run.outputs.controls_ok == 'true' && steps.run.outputs.has_5 == 'true' }}
        uses: isokron-ai/tool-qa/worker-kit@b1f25a9b0b7655f45eb353f31562a93d9319d5a4 # WORKER_KIT_REF
        with:
          bundle-dir: ${{ runner.temp }}/wc/5/bundle
          meta-file: ${{ runner.temp }}/wc/5/meta.json
          attempt-id: ${{ inputs.attempt_id }}
          item-index: '5'
          fence: ${{ steps.run.outputs.fence_5 }}
          run-key: ${{ steps.run.outputs.run_key_5 }}
      - name: Seal and upload item 6
        if: ${{ !cancelled() && steps.teardown.outcome == 'success' && steps.run.outputs.controls_ok == 'true' && steps.run.outputs.has_6 == 'true' }}
        uses: isokron-ai/tool-qa/worker-kit@b1f25a9b0b7655f45eb353f31562a93d9319d5a4 # WORKER_KIT_REF
        with:
          bundle-dir: ${{ runner.temp }}/wc/6/bundle
          meta-file: ${{ runner.temp }}/wc/6/meta.json
          attempt-id: ${{ inputs.attempt_id }}
          item-index: '6'
          fence: ${{ steps.run.outputs.fence_6 }}
          run-key: ${{ steps.run.outputs.run_key_6 }}
      - name: Seal and upload item 7
        if: ${{ !cancelled() && steps.teardown.outcome == 'success' && steps.run.outputs.controls_ok == 'true' && steps.run.outputs.has_7 == 'true' }}
        uses: isokron-ai/tool-qa/worker-kit@b1f25a9b0b7655f45eb353f31562a93d9319d5a4 # WORKER_KIT_REF
        with:
          bundle-dir: ${{ runner.temp }}/wc/7/bundle
          meta-file: ${{ runner.temp }}/wc/7/meta.json
          attempt-id: ${{ inputs.attempt_id }}
          item-index: '7'
          fence: ${{ steps.run.outputs.fence_7 }}
          run-key: ${{ steps.run.outputs.run_key_7 }}
      - name: Seal and upload item 8
        if: ${{ !cancelled() && steps.teardown.outcome == 'success' && steps.run.outputs.controls_ok == 'true' && steps.run.outputs.has_8 == 'true' }}
        uses: isokron-ai/tool-qa/worker-kit@b1f25a9b0b7655f45eb353f31562a93d9319d5a4 # WORKER_KIT_REF
        with:
          bundle-dir: ${{ runner.temp }}/wc/8/bundle
          meta-file: ${{ runner.temp }}/wc/8/meta.json
          attempt-id: ${{ inputs.attempt_id }}
          item-index: '8'
          fence: ${{ steps.run.outputs.fence_8 }}
          run-key: ${{ steps.run.outputs.run_key_8 }}
      - name: Seal and upload item 9
        if: ${{ !cancelled() && steps.teardown.outcome == 'success' && steps.run.outputs.controls_ok == 'true' && steps.run.outputs.has_9 == 'true' }}
        uses: isokron-ai/tool-qa/worker-kit@b1f25a9b0b7655f45eb353f31562a93d9319d5a4 # WORKER_KIT_REF
        with:
          bundle-dir: ${{ runner.temp }}/wc/9/bundle
          meta-file: ${{ runner.temp }}/wc/9/meta.json
          attempt-id: ${{ inputs.attempt_id }}
          item-index: '9'
          fence: ${{ steps.run.outputs.fence_9 }}
          run-key: ${{ steps.run.outputs.run_key_9 }}
